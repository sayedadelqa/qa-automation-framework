[pytest]
base_url = https://www.saucedemo.com
addopts = -v --html=reports/report.html --self-contained-html --screenshot only-on-failure --output=reports/artifacts
markers =
    smoke: quick checks of the most critical flows
    regression: full regression suite
    ui: browser tests (Playwright)
    api: API tests (requests)
    bdd: BDD scenarios written in Gherkin (pytest-bdd)
